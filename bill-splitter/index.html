<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeSplit - Bill Splitter</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        :root {
            --bg-1: #0b1020;
            --bg-2: #111827;
            --card: rgba(15, 23, 42, 0.8);
            --card-strong: rgba(15, 23, 42, 0.95);
            --line: rgba(148, 163, 184, 0.18);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-2: #38bdf8;
            --success: #34d399;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(139, 92, 246, 0.22), transparent 32%),
                radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.2), transparent 28%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
            padding: 24px;
        }

        .app-shell {
            position: relative;
            width: min(100%, 460px);
        }

        .glow {
            position: absolute;
            inset: -24% -12% auto auto;
            width: 220px;
            height: 220px;
            background: rgba(139, 92, 246, 0.18);
            filter: blur(50px);
            border-radius: 50%;
            pointer-events: none;
        }

        .card {
            position: relative;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.55);
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(56, 189, 248, 0.04));
            pointer-events: none;
        }

        .content {
            position: relative;
            padding: 28px 24px 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
            font-weight: 800;
            letter-spacing: 0.04em;
            color: #c4b5fd;
        }

        .brand-mark {
            display: inline-grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(56, 189, 248, 0.18));
            border: 1px solid rgba(196, 181, 253, 0.35);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 18px rgba(139,92,246,0.25);
        }

        .label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .field {
            position: relative;
            margin-bottom: 18px;
        }

        .field input {
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            border-radius: 14px;
            padding: 14px 14px 14px 16px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .field input:focus {
            border-color: rgba(139, 92, 246, 0.9);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
            transform: translateY(-1px);
        }

        .mini-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .summary {
            margin-top: 8px;
            border: 1px solid rgba(139, 92, 246, 0.22);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.96));
            border-radius: 18px;
            padding: 16px 18px;
            text-align: center;
            box-shadow: inset 0 1px rgba(255,255,255,0.04);
        }

        .summary .caption {
            color: var(--muted);
            font-size: 0.74rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        #result {
            display: block;
            font-size: clamp(2rem, 3vw, 2.6rem);
            line-height: 1.1;
            font-weight: 900;
            color: #c4b5fd;
            text-shadow: 0 0 18px rgba(139, 92, 246, 0.25);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
        }

        .stat-box .small-label {
            color: var(--muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: block;
            margin-bottom: 6px;
        }

        .stat-box strong {
            color: var(--text);
            font-size: 0.96rem;
        }

        @media (max-width: 480px) {
            .content { padding: 24px 18px 18px; }
            .mini-grid, .stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="glow"></div>
        <div class="card">
            <div class="content">
                <div class="brand">
                    <span class="brand-mark">💸</span>
                    <span>VibeSplit</span>
                </div>

                <div class="field">
                    <label class="label" for="bill">Bill total</label>
                    <input type="number" id="bill" value="0" min="0" step="0.01" placeholder="0.00">
                </div>

                <div class="mini-grid">
                    <div class="field">
                        <label class="label" for="tip">Tip</label>
                        <input type="number" id="tip" value="15" min="0" step="1" placeholder="15">
                    </div>
                    <div class="field">
                        <label class="label" for="people">People</label>
                        <input type="number" id="people" value="2" min="1" step="1" placeholder="2">
                    </div>
                </div>

                <div class="summary">
                    <div class="caption">Per person</div>
                    <span id="result">$0.00</span>
                </div>

                <div class="stats">
                    <div class="stat-box">
                        <span class="small-label">Tip</span>
                        <strong id="tipAmount">$0.00</strong>
                    </div>
                    <div class="stat-box">
                        <span class="small-label">Total</span>
                        <strong id="finalTotal">$0.00</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const resultSpan = document.getElementById('result');
        const tipAmount = document.getElementById('tipAmount');
        const finalTotal = document.getElementById('finalTotal');

        function calculate() {
            const bill = parseFloat(billInput.value) || 0;
            const tip = parseFloat(tipInput.value) || 0;
            const people = parseInt(peopleInput.value) || 1;

            if (people < 1) {
                resultSpan.textContent = '$0.00';
                tipAmount.textContent = '$0.00';
                finalTotal.textContent = '$0.00';
                return;
            }

            const totalTip = bill * (tip / 100);
            const overallTotal = bill + totalTip;
            const perPerson = overallTotal / people;

            resultSpan.textContent = `$${perPerson.toFixed(2)}`;
            tipAmount.textContent = `$${totalTip.toFixed(2)}`;
            finalTotal.textContent = `$${overallTotal.toFixed(2)}`;
        }

        [billInput, tipInput, peopleInput].forEach(input => input.addEventListener('input', calculate));
        calculate();
    </script>
</body>
</html>
